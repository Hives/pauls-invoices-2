[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pauls-invoices"
version = "0.1.0"
description = "Produce formatted PDF invoices from editable templates."
requires-python = ">=3.11"
dependencies = ["fpdf2>=2.7"]

[tool.setuptools]
packages = ["invoices"]
